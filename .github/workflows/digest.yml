name: digest

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL or video id (leave empty when using "ingest")
        required: false
      ingest:
        description: Release tag or direct file URL of a video you uploaded (instead of a YouTube URL)
        required: false
      profile:
        description: "Profile (default: generic). Example: d2r"
        required: false
      issue:
        description: Issue number to comment on (optional)
        required: false
      recalibrate:
        description: Redo the profile's calibration even if config/videos/<id>.json exists
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: digest-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  CHUNK_SECONDS: "1200"        # one parallel analysis job per 20 minutes of video
  PYTHON_VERSION: "3.12"
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FPS_CAP: ${{ vars.FPS_CAP }}   # optional repository variable: lower the 60 fps analysis cap (e.g. 30)

jobs:
  request:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/digest') ||
      startsWith(github.event.comment.body, '/hud') ||
      startsWith(github.event.comment.body, '/set') ||
      startsWith(github.event.comment.body, '/recalibrate') ||
      startsWith(github.event.comment.body, '/ingest')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.req.outputs.run }}
      issue: ${{ steps.req.outputs.issue }}
      target: ${{ steps.req.outputs.target }}
      video_id: ${{ steps.req.outputs.video_id }}
      mode: ${{ steps.req.outputs.mode }}
      sets: ${{ steps.req.outputs.sets }}
      force: ${{ steps.req.outputs.force }}
      profile: ${{ steps.req.outputs.profile }}
      source: ${{ steps.req.outputs.source }}
      started: ${{ steps.req.outputs.started }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: req
        run: |
          python -m ytdigest.request digest
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - if: steps.req.outputs.error != ''
        env:
          MSG: ${{ steps.req.outputs.error }}
        run: python -m ytdigest.notify error "${{ steps.req.outputs.issue }}" "$MSG"
      - if: steps.req.outputs.run == 'true'
        run: python -m ytdigest.notify started "${{ steps.req.outputs.issue }}" "${{ steps.req.outputs.video_id }}" "Digest (${{ steps.req.outputs.mode }})"

  prepare:
    needs: request
    if: needs.request.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      chunks: ${{ steps.arch.outputs.chunks || steps.plan.outputs.chunks }}
      blocked: ${{ steps.dl.outputs.blocked }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
      - uses: ./.github/actions/setup
        with:
          apt: ffmpeg tesseract-ocr   # tesseract: profile calibration may use OCR
      - name: Already archived in the Release?
        id: plan
        run: python -m ytdigest.prepare plan "${{ needs.request.outputs.video_id }}" work
      # YouTube flags GitHub's datacenter IPs, so the download (and only the download) goes through
      # a free Cloudflare WARP tunnel, retried on a fresh tunnel/IP when refused.
      # Set repository variable USE_WARP=false to turn the tunnel off.
      - name: Download from YouTube
        id: dl
        if: steps.plan.outputs.reused != 'true' && needs.request.outputs.mode != 'ingest'
        env:
          USE_WARP: ${{ needs.request.outputs.video_id != 'SYNTHETIC01' && vars.USE_WARP != 'false' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}   # optional, unused unless the secret exists
        run: scripts/download_via_warp.sh "${{ needs.request.outputs.video_id }}" work
      # /ingest: a file you uploaded to a Release (e.g. from your phone) or a direct file URL
      - name: Ingest uploaded file
        id: ingest
        if: steps.plan.outputs.reused != 'true' && needs.request.outputs.mode == 'ingest'
        env:
          INGEST_SOURCE: ${{ needs.request.outputs.source }}
        run: python -m ytdigest.prepare ingest "${{ needs.request.outputs.video_id }}" work
      - name: Archive to the Release (720p H.264, no audio)
        id: arch
        if: steps.plan.outputs.reused != 'true'
        run: python -m ytdigest.prepare archive "${{ needs.request.outputs.video_id }}" work
      - name: Profile and calibration
        id: cal
        env:
          SETS: ${{ needs.request.outputs.sets }}
          PROFILE: ${{ needs.request.outputs.profile }}
          VID: ${{ needs.request.outputs.video_id }}
        run: |
          args=()
          for s in $SETS; do args+=(--set "$s"); done
          [ "${{ needs.request.outputs.force }}" = "true" ] && args+=(--force)
          [ -n "$PROFILE" ] && args+=(--profile "$PROFILE")
          python -m ytdigest.calibrate "$VID" work --archive-dir work/archive "${args[@]}"
          status=$(cat work/calibration_status.txt)
          sha=$(scripts/commit.sh "Profile/calibration for $VID ($status)" config/videos "digests/$VID/calibration.png")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Post calibration image
        if: steps.cal.outputs.status != 'existing' && steps.cal.outputs.status != 'none'
        run: python -m ytdigest.notify calibration "${{ needs.request.outputs.issue }}" "${{ needs.request.outputs.video_id }}" "${{ steps.cal.outputs.sha }}" "${{ steps.cal.outputs.status }}" work
      - name: Suggest a profile (never switches silently)
        run: python -m ytdigest.notify suggestion "${{ needs.request.outputs.issue }}" work
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            work/info.json
            work/parts.json
          if-no-files-found: ignore
          retention-days: 3

  analyze:
    needs: [request, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}   # includes the calibration commit
      - uses: ./.github/actions/setup
        with:
          apt: ffmpeg tesseract-ocr
      - name: Analyse every frame (${{ matrix.chunk.start }}s - ${{ matrix.chunk.end }}s)
        run: python -m ytdigest.analyze "${{ needs.request.outputs.video_id }}" ${{ matrix.chunk.start }} ${{ matrix.chunk.end }} out --workdir work
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.idx }}
          path: out
          retention-days: 3
          compression-level: 0

  finalize:
    needs: [request, prepare, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
      - uses: ./.github/actions/setup
        with:
          apt: ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: work
      - name: Events, contact sheets, index
        run: python -m ytdigest.finalize "${{ needs.request.outputs.video_id }}" chunks work --started ${{ needs.request.outputs.started }}
      - name: Commit digest
        id: commit
        run: |
          vid="${{ needs.request.outputs.video_id }}"
          sha=$(scripts/commit.sh "Digest for $vid" "digests/$vid")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Update INDEX.md
        run: scripts/commit_index.sh
      - run: python -m ytdigest.notify done "${{ needs.request.outputs.issue }}" "${{ needs.request.outputs.video_id }}" "${{ steps.commit.outputs.sha }}"

  report-failure:
    needs: [request, prepare, analyze, finalize]
    if: failure() && needs.request.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: python -m ytdigest.notify failed "${{ needs.request.outputs.issue }}" "Digest of ${{ needs.request.outputs.video_id }}" "${{ needs.prepare.outputs.blocked }}"
